# nginx reverse proxy for the Seaport platform. Installed to /etc/nginx/sites-available/seaport
#
# HTTPS is mandatory: the app's session cookie is marked Secure in production, so sign-in only
# works over HTTPS. After DNS points at this server run:
#     sudo certbot --nginx -d seaport.yourcompany.com
# certbot adds the 443 server block and certificates; the 80 block below then only redirects.
# Behind an AWS Application Load Balancer that terminates TLS, keep this file as is (the ALB
# sends X-Forwarded-Proto: https) and restrict port 80 to the load balancer's security group.

# Behind an AWS Application Load Balancer, uncomment so $remote_addr is the real client (not the ALB);
# otherwise every user shares one rate-limit bucket. Use your VPC / ALB subnet ranges.
# set_real_ip_from 10.0.0.0/16;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=seaport_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=seaport_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Invoice / statement uploads are sent as JSON (base64); the API accepts up to 15 MB.
    client_max_body_size 20m;
    client_body_timeout 30s;
    keepalive_timeout 30s;

    location /api/health {
        proxy_pass http://127.0.0.1:3000;
    }

    # Brute-force protection in front of the app's own per-IP and per-account limits.
    location /api/auth/ {
        limit_req zone=seaport_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/seaport-proxy.conf;
    }

    location / {
        limit_req zone=seaport_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/seaport-proxy.conf;
    }
}
