# nginx reverse proxy for the Seaport platform. Installed to /etc/nginx/sites-available/seaport
# HTTPS: run `sudo certbot --nginx -d your.domain.com` after DNS points at this server.
server {
    listen 80;
    server_name _;

    # Invoice / statement uploads are sent as JSON (base64); the API accepts up to 15 MB.
    client_max_body_size 20m;

    # IMPORTANT: until real sign-in (Module 7) is deployed, the app's user picker is a demo.
    # Keep this password gate ON, and restrict the EC2 security group to your office/VPN IPs.
    auth_basic "Seaport Global";
    auth_basic_user_file /etc/nginx/seaport.htpasswd;

    location /api/health {
        auth_basic off;               # load balancer / uptime checks
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
